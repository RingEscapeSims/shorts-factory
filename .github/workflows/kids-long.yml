# Builds THREE long-form (16:9) kids videos a day and uploads them.
#
# Each video is its own matrix job, so they render in parallel (~65 min wall
# clock) instead of one 3-hour job. Billing is by minutes consumed, so the
# matrix does not save minutes — it just keeps every job well inside the
# 6-hour job ceiling and means one failure does not lose the other two.
#
# COST — this is the expensive workflow. A long video is N short renders
# glued together, and on a 2-core runner a 28-second segment is 8-12 min:
#     3 long/day at 4 minutes each  ~= 190 runner-min/day  ~= 5,700/month
#     plus kids-daily.yml's shorts  ~=  20 runner-min/day  ~=   600/month
# A PRIVATE repo has 2,000 free minutes/month, so this schedule needs the
# repo to be PUBLIC (unlimited free minutes) or it stops around day 10.
# The other options are a lower `minutes` input, supersample 1, or moving
# rendering to a free always-on VM. See SETUP_PHONE.md.
name: Kids long-form video

on:
  schedule:
    # 00:47 UTC ~= 06:17 IST. Off the top of the hour on purpose: GitHub's
    # shared scheduler is most congested at :00 and queues behind it.
    - cron: "47 0 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many long videos this run"
        default: "3"
        type: choice
        options: ["1", "2", "3"]
      minutes:
        description: "Target length of each video, in minutes"
        default: "4"
        type: string
      privacy:
        description: "Privacy for this run"
        default: "unlisted"
        type: choice
        options: [unlisted, public, private]
      supersample:
        description: "2 = ship quality, 1 = ~4x faster"
        default: "2"
        type: choice
        options: ["2", "1"]

permissions:
  contents: write

jobs:
  # Turn the requested count into a matrix list, so a manual run can build
  # fewer than the scheduled three without editing the file.
  plan:
    runs-on: ubuntu-latest
    outputs:
      slots: ${{ steps.mk.outputs.slots }}
    steps:
      - id: mk
        run: |
          N="${{ github.event.inputs.count || '3' }}"
          case "$N" in
            1) echo 'slots=["1"]' >> "$GITHUB_OUTPUT" ;;
            2) echo 'slots=["1","2"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'slots=["1","2","3"]' >> "$GITHUB_OUTPUT" ;;
          esac

  build-long:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false          # one bad video must not cancel the others
      matrix:
        slot: ${{ fromJson(needs.plan.outputs.slots) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and a friendly font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-comic-neue fonts-dejavu-core
          ffmpeg -version | head -1

      - name: Install Python packages
        run: pip install --quiet -r requirements.txt

      - name: Restore cached voice model
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-en_US-ljspeech-high-v1

      - name: Download voice model (first run only)
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: python kids_studio.py --setup-voice

      - name: Write credentials
        env:
          KIDS_TOKEN_JSON: ${{ secrets.KIDS_TOKEN_JSON }}
          KIDS_CLIENT_SECRET_JSON: ${{ secrets.KIDS_CLIENT_SECRET_JSON }}
          RT: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -n "$RT" ]; then
            echo "Using YT_REFRESH_TOKEN (kids channel)."
          elif [ -n "$KIDS_TOKEN_JSON" ]; then
            printf '%s' "$KIDS_TOKEN_JSON" > token.json
            printf '%s' "$KIDS_CLIENT_SECRET_JSON" > client_secret.json
            echo "Using KIDS_TOKEN_JSON (kids channel)."
          else
            echo "::error::No kids credentials. This workflow deliberately"
            echo "::error::does NOT fall back to the rings token, because a"
            echo "::error::kids video must never land on the rings channel."
            exit 1
          fi

      - name: Build one long video
        env:
          KIDS_SS: ${{ github.event.inputs.supersample || '2' }}
        run: |
          mkdir -p queue published
          # Distinct seed per slot per day, so the three videos of a day
          # never coincide and tomorrow's never repeat today's.
          SEED=$(( ( $(date -u +%Y%m%d) * 7 + ${{ matrix.slot }} * 104729 ) % 999983 ))
          echo "slot ${{ matrix.slot }} seed $SEED"
          python make_long.py --seed "$SEED" \
            --minutes "${{ github.event.inputs.minutes || '4' }}" \
            --outdir queue

      - name: Upload
        env:
          CI: "true"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          # Without pipefail the pipeline reports TEE's exit code, so a
          # crashed upload would show as a green run. See kids-daily.yml.
          set -o pipefail
          PRIVACY="${{ github.event.inputs.privacy || '' }}"
          ARGS="--dir queue --archive published"
          if [ -n "$PRIVACY" ]; then ARGS="$ARGS --privacy $PRIVACY"; fi
          python upload_youtube.py $ARGS | tee upload_out.txt

      - name: Record what was published
        # Bookkeeping only — must never fail the job once the video is up,
        # or retry.yml would re-render and publish a duplicate.
        if: success()
        continue-on-error: true
        run: |
          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          grep -o 'https://youtube.com/[A-Za-z0-9_/-]*' upload_out.txt \
            | while read -r url; do
                echo "$STAMP  LONG  $url" >> uploads.log
              done
          [ -z "$(git status --porcelain uploads.log)" ] && exit 0
          git config user.name  "shorts-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Three matrix jobs finish around the same time and all push to
          # the same branch, so retry the rebase-push a few times.
          for attempt in 1 2 3 4 5; do
            git add uploads.log
            git diff --cached --quiet && break
            git commit -m "log: long-form upload $STAMP (slot ${{ matrix.slot }})"
            if git pull --rebase -q && git push -q; then
              echo "logged on attempt $attempt"; break
            fi
            echo "push race, retrying ($attempt)"
            git reset --soft HEAD~1 2>/dev/null || true
            sleep $(( attempt * 7 ))
          done

      - name: Keep the render if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-long-${{ github.run_id }}-${{ matrix.slot }}
          path: |
            queue/
            upload_out.txt
          retention-days: 7
          if-no-files-found: ignore
