name: shorts-factory

on:
  schedule:
    # ONE Short per day, down from two (8 Aug 2026).
    #
    # This is deliberate and counter-intuitive. 8 videos at ~1,000 views each
    # showed volume was never the bottleneck — the format's whole recent
    # cohort sits under ~1.1k regardless of who uploads it. Meanwhile daily
    # templated output is the exact signal behind January's terminations, so
    # the second daily slot was buying nothing and costing risk. The freed
    # capacity goes to rings-long.yml instead, which is where the one
    # still-growing channel in this niche went.
    #
    # 22:17 UTC ~= 6:15 PM US Eastern. Off the top of the hour on purpose:
    # GitHub's shared scheduler is most congested at :00.
    - cron: '17 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg + fonts
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-dejavu-core \
              || { sudo apt-get update -q; sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-dejavu-core; }
          fi
          ffmpeg -version | head -1

      - name: Install Python packages
        run: pip install -q numpy pillow google-api-python-client google-auth-oauthlib

      - name: Write credentials from secrets
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json

      - name: Generate and upload one Short
        run: python daily_run.py --count 1

      - name: Log the run (keeps scheduled workflows from being auto-disabled)
        # Bookkeeping only. It must never fail the job: a red run here would
        # trigger the retry workflow and republish a video already uploaded.
        continue-on-error: true
        run: |
          git config user.name "shorts-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          date -u +"%Y-%m-%d %H:%M UTC uploaded 1 video" >> upload_log.txt
          git add upload_log.txt
          git commit -m "log: scheduled upload"
          git pull --rebase
          git push
