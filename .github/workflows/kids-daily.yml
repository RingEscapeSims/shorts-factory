# Renders KIDS SHORTS in the cloud and uploads them. No PC required.
# Long-form is a separate workflow (kids-long.yml).
#
# This is also separate from daily.yml, which runs the rings engine on its
# own schedule and its own credentials. No workflow touches another's.
#
# Two shorts a day, one per scheduled run. Each run picks a mode at random
# from all six (counting, colours, shapes, abc, rhyme, story) and a setting
# independently of that, so the morning and evening drop are never alike.
#
# Cron is ALWAYS UTC. The times below are India time (UTC+5:30). If you
# move: your_local_hour - your_utc_offset = the hour to write here.
name: Daily kids videos

on:
  schedule:
    # 03:38 & 12:41 UTC ~= 09:08 & 18:11 IST. Deliberately off the top of
    # the hour and off :00/:30 — GitHub's shared scheduler is most congested
    # there and scheduled runs queue behind the spike.
    - cron: "38 3 * * *"
    - cron: "41 12 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many shorts to make this run"
        default: "1"
        type: string
      privacy:
        description: "Privacy for this run"
        default: "unlisted"
        type: choice
        options: [unlisted, public, private]
      supersample:
        description: "2 = ship quality, 1 = ~4x faster draft"
        default: "2"
        type: choice
        options: ["2", "1"]

# Never let two runs upload at the same time.
concurrency:
  group: kids-upload
  cancel-in-progress: false

permissions:
  contents: write          # to append the upload log (also keeps cron alive)

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and a friendly font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-comic-neue fonts-dejavu-core
          ffmpeg -version | head -1
          fc-list | grep -i "comic" || echo "note: Comic Neue not found, will use DejaVu"

      - name: Install Python packages
        run: pip install --quiet -r requirements.txt

      # The voice model is ~114 MB, over GitHub's 100 MB file limit, so it is
      # never committed. Cache it so it downloads once, not twice a day.
      - name: Restore cached voice model
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-en_US-ljspeech-high-v1

      - name: Download voice model (first run only)
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: |
          python kids_studio.py --setup-voice
          ls -lh voices/

      # Two supported credential styles. Use KIDS_* secrets to send kids
      # videos to their own channel (recommended); otherwise this falls
      # back to the same TOKEN_JSON the rings workflow already uses, which
      # means kids videos land on the SAME channel as the rings ones.
      - name: Write credentials
        env:
          KIDS_TOKEN_JSON: ${{ secrets.KIDS_TOKEN_JSON }}
          KIDS_CLIENT_SECRET_JSON: ${{ secrets.KIDS_CLIENT_SECRET_JSON }}
          RT: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -n "$RT" ]; then
            echo "Using YT_REFRESH_TOKEN (kids channel, device-flow auth)."
          elif [ -n "$KIDS_TOKEN_JSON" ]; then
            printf '%s' "$KIDS_TOKEN_JSON" > token.json
            printf '%s' "$KIDS_CLIENT_SECRET_JSON" > client_secret.json
            echo "Using KIDS_TOKEN_JSON (kids channel)."
          else
            # There used to be a fall-back to the rings token here. It is
            # gone on purpose: the kids channel is now a separate Google
            # account, and silently publishing kids videos to the rings
            # channel is worse than not publishing at all.
            echo "::error::No kids credentials found."
            echo "::error::Set YT_CLIENT_ID + YT_CLIENT_SECRET, then run the"
            echo "::error::'Authorize YouTube (one time)' workflow while"
            echo "::error::signed in as dhakechaharsh3. See SETUP_PHONE.md."
            exit 1
          fi

      - name: Render and upload
        env:
          CI: "true"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          KIDS_SS: ${{ github.event.inputs.supersample || '2' }}
        run: |
          # Without pipefail, `python ... | tee` reports TEE's exit code, so
          # a crashed upload shows as a green run and the retry never fires.
          # That silently hid an invalid_grant failure on 7 Aug.
          set -o pipefail
          COUNT="${{ github.event.inputs.count || '1' }}"
          PRIVACY="${{ github.event.inputs.privacy || '' }}"

          mkdir -p queue published
          for i in $(seq 1 "$COUNT"); do
            SEED=$((RANDOM * 32768 + RANDOM))
            echo "::group::Rendering video $i/$COUNT (seed $SEED)"
            python kids_studio.py --mode random --seed "$SEED" \
              --count 1 --outdir queue
            echo "::endgroup::"
          done

          ARGS="--dir queue --archive published"
          if [ -n "$PRIVACY" ]; then ARGS="$ARGS --privacy $PRIVACY"; fi
          python upload_youtube.py $ARGS | tee upload_out.txt

      - name: Record what was published
        # Bookkeeping only. It must never fail the job: the video is already
        # published by this point, and a red run here would make a retry
        # republish it.
        if: success()
        continue-on-error: true
        run: |
          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          grep -o 'https://youtube.com/shorts/[A-Za-z0-9_-]*' upload_out.txt \
            | while read -r url; do
                echo "$STAMP  SHORT $url" >> uploads.log
              done
          [ -z "$(git status --porcelain uploads.log)" ] && exit 0
          git config user.name  "shorts-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Several workflows commit to this branch and can finish at
          # overlapping times, so retry the rebase-push rather than losing
          # the log line. Committing also counts as repository activity,
          # which stops GitHub auto-disabling cron after 60 idle days.
          for attempt in 1 2 3 4 5; do
            git add uploads.log
            git diff --cached --quiet && break
            git commit -m "log: kids short $STAMP"
            if git pull --rebase -q && git push -q; then
              echo "logged on attempt $attempt"; break
            fi
            echo "push race, retrying ($attempt)"
            git reset --soft HEAD~1 2>/dev/null || true
            sleep $(( attempt * 7 ))
          done

      - name: Keep the rendered files if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-run-${{ github.run_id }}
          path: |
            queue/
            upload_out.txt
          retention-days: 7
          if-no-files-found: ignore
