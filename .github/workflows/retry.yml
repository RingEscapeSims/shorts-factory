name: retry-failed-upload

# GitHub occasionally cannot allocate a runner for a scheduled job ("the job
# was not acquired by Runner of type hosted"). That kills the slot before any
# of our steps execute. This workflow gives the run a second and third chance
# instead of silently dropping a video.

on:
  workflow_run:
    workflows: ["shorts-factory"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Wait out the incident, then re-run the failed job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 180
          gh run rerun ${{ github.event.workflow_run.id }} \
            --failed --repo ${{ github.repository }}
